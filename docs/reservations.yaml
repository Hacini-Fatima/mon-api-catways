tags:
  name: Reservations
  description: Gestion des réservations

/catways/{id}/reservations:
  get:
    summary: Lister les réservations
    tags: [Reservations]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Liste des réservations
  post:
    summary: Créer une réservation
    tags: [Reservations]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              clientName: { type: string, example: "Jack Sparrow" }
              boatName: { type: string, example: "Black Pearl" }
              checkIn: { type: string, format: date-time }
              checkOut: { type: string, format: date-time }
    responses:
      '201':
        description: Réservation créée

/catways/{id}/reservations/{idReservation}:
  get:
    summary: Détails d'une réservation
    tags: [Reservations]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: idReservation
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Détails de la réservation
  delete:
    summary: Supprimer une réservation
    tags: [Reservations]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: idReservation
        required: true
        schema: { type: string }
    responses:
      '204':
        description: Réservation supprimée